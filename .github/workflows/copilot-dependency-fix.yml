name: Copilot dependency conflict fix

on:
  workflow_dispatch:
    inputs:
      dependency:
        description: "Dependency to bump, as groupId:artifactId (e.g. org.bouncycastle:bcprov-jdk18on)"
        required: true
      version:
        description: "Target version to bump it to (e.g. 1.78)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-dependency-conflicts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Create working branch
        id: branch
        run: |
          safe_dep=$(echo "${{ inputs.dependency }}" | tr ':/' '--')
          branch="copilot/dep-fix/${safe_dep}-${{ inputs.version }}-${{ github.run_number }}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Bump target dependency version
        run: |
          mvn -B org.codehaus.mojo:versions-maven-plugin:2.21.0:use-dep-version \
            -Dincludes="${{ inputs.dependency }}" \
            -DdepVersion="${{ inputs.version }}" \
            -DforceVersion=true

      - name: Generate verbose dependency tree
        run: mvn -B -q dependency:tree -Dverbose -DoutputFile=dependency-tree.txt

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Analyze and fix conflicts with Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -p "$(cat <<'PROMPT'
          I just bumped the Maven dependency ${{ inputs.dependency }} to version ${{ inputs.version }} in pom.xml.

          Read dependency-tree.txt (output of `mvn dependency:tree -Dverbose`) and identify:
          1. Version conflicts / non-converging versions caused by this bump (lines marked "omitted for conflict").
          2. Any resulting circular or duplicate transitive dependency issues.

          Fix pom.xml directly: prefer adding/adjusting a <dependencyManagement> entry to force a
          single converged version, or add targeted <exclusions> on the specific dependency edge that
          introduces the conflict. Do not downgrade ${{ inputs.dependency }} below ${{ inputs.version }}.
          Keep changes minimal and do not touch unrelated dependencies.

          After editing pom.xml, run `mvn -q -DskipTests compile` to confirm it still builds; if it
          fails, keep iterating on the fix until it compiles.

          Finally, write a short Markdown summary of what conflicted and what you changed to
          dependency-fix-summary.md.
          PROMPT
          )" --allow-tool='shell(mvn:*)' --allow-tool=write --no-ask-user

      - name: Verify build
        run: mvn -B -q -DskipTests package

      - name: Commit and push fix
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml dependency-fix-summary.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Fix dependency conflicts from bumping ${{ inputs.dependency }} to ${{ inputs.version }}"
            git push origin "${{ steps.branch.outputs.name }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Fix dependency conflicts from ${{ inputs.dependency }}@${{ inputs.version }}" \
            --body-file dependency-fix-summary.md \
            --base "${{ github.ref_name }}" \
            --head "${{ steps.branch.outputs.name }}"
